[project]
name = "lucas-v2"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tristan", email = "tristan.robet@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.0",
    "google-api-python-client>=2.200.0",
    "libsql-experimental>=0.0.55",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "transformers>=5.16.1",
    "yt-dlp>=2026.8.19",
]

[project.scripts]
lucas-v2 = "lucas_v2:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "mypy>=1.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.coverage.run]
source = ["lucas_v2"]

[tool.coverage.report]
show_missing = true
