[project]
name = "lucas-v2"
version = "0.2.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Tristan", email = "tristan.robet@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.0",
    "google-api-python-client>=2.200.0",
    "libsql>=0.1.11",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
    "pyyaml>=6.0.3",
    "requests>=2.34.2",
    "transformers>=5.16.1",
    "yt-dlp>=2026.8.19",
    "streamlit>=1.35",
]

[project.scripts]
lucas-v2 = "lucas_v2:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "pyright>=1.1.411",
    "playwright>=1.63.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true

[tool.coverage.run]
source = ["lucas_v2"]

[tool.coverage.report]
show_missing = true

[tool.pyright]
# ------------------------------------------------------------------------------
# Target Environment
# Sets the target Python version and OS platform for standard library checks.
# Keeps local VS Code analysis aligned with CI pipelines regardless of host OS.
# ------------------------------------------------------------------------------
pythonVersion = "3.11"
pythonPlatform = "Linux"

# ------------------------------------------------------------------------------
# Source File Scoping
# Limits type checking strictly to your project files, ignoring build artifacts,
# cache folders, and virtual environments.
# ------------------------------------------------------------------------------
include = [
    "src",
    "tests"
]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    "**/.venv",
    "**/.tox",
    "**/build",
    "**/dist"
]

# ------------------------------------------------------------------------------
# Import & Execution Rules
# Alignment keys to ensure Pylance and Pyright handle third-party libraries the same.
# ------------------------------------------------------------------------------
# Ensures Pyright parses source code of untyped packages (matching default Pylance behavior)
useLibraryCodeForTypes = true

# Prevents import errors if you use editable installs or 'src' layout
extraPaths = ["src"]

# Custom stub directory if you write local .pyi type stubs
stubPath = "typings"

# ------------------------------------------------------------------------------
# Diagnostic Level
# Options: "off", "basic", "standard", or "strict"
# "standard" is the recommended baseline for modern typed Python code.
# ------------------------------------------------------------------------------
typeCheckingMode = "strict"

# ------------------------------------------------------------------------------
# Explicit Rule Overrides
# Explicitly setting these ensures Pylance user settings in settings.json
# cannot silently diverge from Pyright CLI behavior.
# ------------------------------------------------------------------------------
reportMissingImports = "error"
reportMissingTypeStubs = false
reportImportCycles = "warning"
reportUnusedImport = "warning"
reportUnusedClass = "warning"
reportUnusedFunction = "warning"
reportUnusedVariable = "warning"
reportDuplicateImport = "error"
reportWildcardImportFromLibrary = "error"
reportPrivateUsage = "warning"
reportConstantRedefinition = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportUntypedFunctionDecorator = "warning"
reportUntypedClassDecorator = "warning"

